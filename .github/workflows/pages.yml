name: Deploy offline map
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore map data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download map-data-2026-11-02 --pattern 'korea-tiles.zip*' --dir artifacts
          python scripts/tile_bundle.py restore artifacts/korea-tiles.zip
          python scripts/check_assets.py
      - name: Validate and build offline inventory
        run: |
          node --test tests/*.test.cjs
          node --check www/offline.js
          node --check www/sw.js
          python scripts/build_offline_manifest.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
